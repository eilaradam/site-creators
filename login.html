<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · Lara Dam</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <style>
        :root {
            --black: #0A0A0A;
            --white: #FAFAF9;
            --cream: #F5F3EF;
            --warm: #E8E4DD;
            --accent: #D4572A;
            --accent-dark: #B8461F;
            --accent-glow: rgba(212,87,42,0.12);
            --text: #1A1816;
            --text-soft: #6B645C;
            --text-muted: #9C958C;
            --border: #DDD8D0;
            --card: #FFFFFF;
            --success: #2D7A4F;
            --error: #C4453C;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', sans-serif; background: var(--cream); color: var(--text); -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .login-wrapper { width: 100%; max-width: 420px; }
        .login-logo { text-align: center; margin-bottom: 32px; }
        .login-logo a { font-family: 'Fraunces', serif; font-weight: 700; font-size: 28px; color: var(--text); text-decoration: none; }
        .login-logo a span { color: var(--accent); }
        .login-box { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 48px 40px; box-shadow: 0 4px 24px rgba(0,0,0,0.04); position: relative; overflow: hidden; }
        .login-box::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--accent), #E8784A, var(--accent)); }
        .login-box h1 { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.5px; }
        .login-box p { font-size: 14px; color: var(--text-soft); margin-bottom: 28px; line-height: 1.6; }
        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
        .field input { width: 100%; padding: 14px 16px; border: 1.5px solid var(--border); border-radius: 12px; font-family: 'Outfit', sans-serif; font-size: 15px; color: var(--text); background: var(--cream); outline: none; transition: all 0.25s; }
        .field input:focus { border-color: var(--accent); background: var(--card); box-shadow: 0 0 0 4px var(--accent-glow); }
        .login-btn { width: 100%; margin-top: 8px; padding: 16px; background: var(--accent); color: white; border: none; border-radius: 14px; font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s; }
        .login-btn:hover { background: var(--accent-dark); transform: translateY(-1px); }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .login-error { background: rgba(196,69,60,0.08); border: 1px solid rgba(196,69,60,0.2); color: var(--error); padding: 12px 16px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; display: none; }
        .login-error.show { display: block; }
        .login-footer { text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-muted); }
        .login-footer a { color: var(--accent); text-decoration: none; font-weight: 600; }
        @media (max-width: 480px) { .login-box { padding: 36px 24px; } }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-logo"><a href="index.html">lara<span>.</span>dam</a></div>
        <div class="login-box">
            <h1>Acesso restrito</h1>
            <p>Faça login para acessar o painel.</p>
            <div class="login-error" id="loginError"></div>
            <form id="loginForm">
                <div class="field">
                    <label>E-mail</label>
                    <input type="email" id="loginEmail" required placeholder="seu@email.com" autocomplete="email">
                </div>
                <div class="field">
                    <label>Senha</label>
                    <input type="password" id="loginPassword" required placeholder="Sua senha" autocomplete="current-password">
                </div>
                <button type="submit" class="login-btn" id="loginBtn">Entrar</button>
            </form>
        </div>
        <div class="login-footer"><a href="index.html">← Voltar ao site</a></div>
    </div>

<script>
    /* Auto-redirect se já logado */
    (async function() {
        const { sb } = Auth;
        if (!sb) return;
        try {
            const { data: { session } } = await sb.auth.getSession();
            if (session) {
                const role = await Auth.getRole(session.user.id);
                if (role) Auth.redirectByRole(role);
            }
        } catch (e) {}
    })();

    /* Login */
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('loginBtn');
        const errorEl = document.getElementById('loginError');
        errorEl.classList.remove('show');
        btn.textContent = 'Entrando...';
        btn.disabled = true;

        try {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const { role } = await Auth.login(email, password);
            Auth.redirectByRole(role);
        } catch (err) {
            errorEl.textContent = err.message || 'Erro ao fazer login.';
            errorEl.classList.add('show');
            btn.textContent = 'Entrar';
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
